name: ai-critic-agent
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # -----------------------------
  # Python 基础
  # -----------------------------
  - python=3.10
  - pip

  # -----------------------------
  # 基础工具 (固定 NumPy 1.x)
  # -----------------------------
  - numpy=1.26.4  # 固定版本，避免 2.x
  - pandas
  - tqdm>=4.65.0
  - pyyaml

  # -----------------------------
  # PyTorch (Mac ARM 优化版本)
  # -----------------------------
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision
  
  # -----------------------------
  # Web / API
  # -----------------------------
  - fastapi
  - uvicorn

  # -----------------------------
  # Pip 安装的核心 AI 库
  # -----------------------------
  - pip:
      # ===== LangChain 核心 =====
      - langchain>=0.2.0
      - langchain-community
      - langchain-openai

      # ===== OpenAI SDK =====
      - openai>=1.0.0

      # ===== 向量数据库 (兼容 NumPy 1.x) =====
      - faiss-cpu==1.7.4
      
      # ===== Embedding / NLP (兼容版本组合 - Mac M4 测试通过) =====
      - sentence-transformers==2.2.2
      - transformers==4.30.2
      - huggingface-hub==0.16.4
      - tokenizers==0.13.3
      - tiktoken

      # ===== 数据校验 / 结构化输出 =====
      - pydantic>=2.0

      # ===== 日志 & 调试 =====
      - loguru

      # ===== 文件加载 =====
      - unstructured
      - markdown

      # ===== CLI / 工具 =====
      - typer