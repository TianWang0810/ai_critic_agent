name: ai-critic-agent
channels:
  - conda-forge
  - defaults

dependencies:
  # -----------------------------
  # Python 基础
  # -----------------------------
  - python=3.10
  - pip

  # -----------------------------
  # 基础工具
  # -----------------------------
  - numpy
  - pandas
  - tqdm
  - pyyaml

  # -----------------------------
  # Web / API（可选，但强烈推荐）
  # -----------------------------
  - fastapi
  - uvicorn

  # -----------------------------
  # Pip 安装的核心 AI 库
  # -----------------------------
  - pip:
      # ===== LangChain 核心 =====
      - langchain>=0.2.0
      - langchain-community
      - langchain-openai

      # ===== OpenAI SDK =====
      - openai>=1.0.0

      # ===== 向量数据库 =====
      - faiss-cpu

      # ===== Embedding / NLP =====
      - tiktoken

      # ===== 数据校验 / 结构化输出 =====
      - pydantic>=2.0

      # ===== 日志 & 调试 =====
      - loguru

      # ===== 文件加载 =====
      - unstructured
      - markdown

      # ===== CLI / 工具（可选） =====
      - typer
